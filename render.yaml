# Render blueprint — links the "raffle" Environment Group (evg-d9r0s7u1egvs73bdi51g)
# to both services, so all backend variables live in one place.

version: "1"

# Environment Group "raffle" — values are kept in Render (sync: false).
envVarGroups:
  - name: raffle
    envVars:
      - key: MP_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_URL
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_WEBHOOK_TOLERANCE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_HOST
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL
        sync: false
      - key: EMAIL_P
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

# NOTE: VITE_API_URL is intentionally NOT in the env group. The committed
# .env.production (forced via vite.config.ts `define`) supplies it at build
# time. Having it here as an env var invites an empty-variable shadow override.

services:
  # ----- Backend (Node web service) -----
  # Link ONLY the shared group. Do NOT add per-service env vars here: an empty
  # service-level value shadows the group's (same trap that broke VITE_API_URL).
  - type: web
    name: Raffle-web
    runtime: node
    repo: https://github.com/JohnVictorCrown/Raffle
    plan: free
    region: virginia
    buildCommand: bun install
    startCommand: bun run server:node
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: raffle

  # ----- Frontend (static site) -----
  - type: web
    name: Raffle
    runtime: static
    repo: https://github.com/JohnVictorCrown/Raffle
    buildCommand: bun install && bun run build:web
    staticPublishPath: dist
    autoDeployTrigger: commit
    # SPA fallback: /admin, /me, /withdraw are client-side routes, so rewrite
    # every unknown path to index.html instead of 404ing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - fromGroup: raffle
