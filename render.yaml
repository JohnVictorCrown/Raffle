# Render blueprint — links the "raffle" Environment Group (evg-d9r0s7u1egvs73bdi51g)
# to both services, so all backend variables live in one place.

version: "1"

# Environment Group "raffle" — values are kept in Render (sync: false).
envVarGroups:
  - name: raffle
    envVars:
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_WEBHOOK_TOLERANCE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_HOST
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VITE_API_URL
        sync: false

services:
  # ----- Backend (Node web service) -----
  - type: web
    name: Raffle-web
    runtime: node
    repo: https://github.com/JohnVictorCrown/Raffle
    plan: free
    region: virginia
    buildCommand: bun install
    startCommand: bun run server:node
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: raffle

  # ----- Frontend (static site) -----
  - type: web
    name: Raffle
    runtime: static
    repo: https://github.com/JohnVictorCrown/Raffle
    buildCommand: bun install && bun run build:web
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - fromGroup: raffle
